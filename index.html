<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sivú · Invitaciones digitales</title>

    <!-- Que la invitación no salga en los buscadores: es personal y se comparte
         por enlace directo. La tarjeta de vista previa de WhatsApp (og:*) sigue
         funcionando, porque esa la piden los propios servidores de WhatsApp. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- La API va en otro dominio: abrir la conexión desde el HTML ahorra el
         DNS y el TLS que si no se pagarían al pedir los datos. -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />

    <!-- Tarjeta que se ve al compartir cualquier enlace del dominio (landing,
         plantillas e invitaciones) por WhatsApp u otras apps. Es la marca
         Sivú, no un evento: el rastreador de WhatsApp no ejecuta
         JavaScript y el sitio es estático, así que no puede personalizarla
         por evento. Antes mostraba la boda de Ricardo y Maite, que ya pasó.
         La imagen vive en public/sivu-og.jpg (1200×630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sivú" />
    <meta property="og:title" content="Sivú · Invitaciones digitales que enamoran" />
    <meta
      property="og:description"
      content="Invitaciones digitales para bodas, XV años y eventos, con confirmación de asistencia en vivo."
    />
    <meta property="og:image" content="%VITE_SITIO_URL%/sivu-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sivú: invitaciones digitales en el celular" />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F8F4EE" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
