services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: invitacion
      POSTGRES_USER: invitacion
      POSTGRES_PASSWORD: invitacion
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
