<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel — Sivú</title>

    <!-- Que no lo indexe ningún buscador aunque la URL se filtre. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Anti-clickjacking sin depender del servidor: si la página se carga
         dentro de un iframe (window !== top), se rompe el marco y se navega
         fuera. Complementa la cabecera X-Frame-Options del servidor. -->
    <script>
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }
    </script>
  </head>
  <body class="bg-paper text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
