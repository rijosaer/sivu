<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel — Sivú</title>
    <!-- Instalable como app en el celular (ícono en la pantalla de inicio). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#5C0F27" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sivú" />

    <!-- Que no lo indexe ningún buscador aunque la URL se filtre. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Fraunces:opsz,wght@9..144,400..650&family=Work+Sans:wght@400;500;600;700&display=swap" />

    <meta name="robots" content="noindex, nofollow" />

    <!-- Anti-clickjacking sin depender del servidor: si la página se carga
         dentro de un iframe (window !== top), se rompe el marco y se navega
         fuera. Complementa la cabecera X-Frame-Options del servidor. -->
    <script>
      if (window.top !== window.self) {
        window.top.location = window.self.location;
      }
    </script>
  </head>
  <body class="bg-lienzo text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
